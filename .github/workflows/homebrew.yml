name: Update Homebrew tap

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency: homebrew-tap

jobs:
  update:
    if: github.repository == 'MandalorianY/french-job-scraper' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MandalorianY/homebrew-tap
          ref: main
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update formula from the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=$(gh release view --json tagName --jq .tagName)
          if [[ "$RELEASE_TAG" != "$latest_tag" || ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi

          version=${RELEASE_TAG#v}
          asset="scrapper-$version.tar.gz"
          gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$RUNNER_TEMP"
          checksum=$(sha256sum "$RUNNER_TEMP/$asset" | cut -d ' ' -f 1)

          message="Update jobsfr to $version"
          if [[ -f tap/Formula/job-scrapper.rb ]]; then
            message="jobsfr: renamed from job-scrapper"
          fi
          bash deploy/homebrew/stage-tap.sh tap "$version" "$checksum"
          if git -C tap diff --cached --quiet; then
            exit 0
          fi
          git -C tap -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$message"
          git -C tap push origin HEAD:main
