name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      # The root README.md is used in package metadata.
      - AGENTS.md
      - 'docs/**/*.md'
      - deploy/README.md
  pull_request:
    paths-ignore:
      - AGENTS.md
      - 'docs/**/*.md'
      - deploy/README.md

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.target.runner }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - {runner: ubuntu-24.04, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: aarch64}
          - {runner: macos-26-intel, arch: x86_64}
          - {runner: macos-26, arch: aarch64}
          - {runner: windows-2025, arch: x86_64}
          - {runner: windows-11-arm, arch: aarch64}
        python-version: ["3.13", "3.14"]
    env:
      SCRAPPER_DISABLE_LOCAL_CONFIG: "1"
      SCRAPPER_RUN_REAL_SMOKE: "0"
      PYTHONUTF8: "1"
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON_ARCH: ${{ matrix.target.arch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies from wheels
        run: uv sync --locked --group test --no-install-project --no-build --no-cache

      - name: Install the ODS test extra
        run: uv sync --locked --group test --extra ods --no-install-project

      - name: Build package
        run: uv build --no-sources

      - name: Install built wheel
        run: uv pip install --no-deps --no-index --find-links dist scrapper

      - name: Check installed CLI and employer catalog
        run: |
          uv run --locked --no-sync jobsfr --status
          uv run --locked --no-sync job-scrapper --version
          uv run --locked --no-sync python -c "from scrapper.company_types import company_types; company_types()"

      - name: Type-check Windows, Linux, and macOS
        if: matrix.target.runner == 'ubuntu-24.04' && matrix.python-version == '3.14'
        env:
          UV_NO_SYNC: "1"
        run: uv run --locked --no-sync poe typecheck

      - name: Lint, check formatting, and test
        env:
          UV_NO_SYNC: "1" # Keep the built wheel installed during Poe's nested uv runs.
        run: uv run --locked poe test
