# Deduplication
# Smaller source priority numbers are preferred.
# dedupe_source_priority:
#   indeed: 0
#   linkedin: 10
#   welcome_to_the_jungle: 20
#   france_travail: 1000
# dedupe_default_source_priority: 100
# dedupe_fields:
#   primary: [title, company]
#   fallback: [location]
#   description: [description, company, location]

# Runtime paths for a separate profile. Installed builds have per-user defaults.
# paths:
#   database_path: data/toulouse-data-analyst/job_search.duckdb
#   export_dir: exports/toulouse-data-analyst
#   log_file: data/toulouse-data-analyst/jobsfr.jsonl

# Defaults for jobsfr schedule enable. Linux uses Paris time and macOS uses system time.
# schedule:
#   days: [mon, tue, wed, thu, fri]
#   time: "15:30"

# Tracker output. Edit the first format in the list. CSV writes jobs.csv and jobs_raw.csv.
# ODS needs the ods extra in a checkout. The default formats are xlsx and csv.
# Available columns
# Postulé, Rejeté, Lien, Statut, Postuler, Offre source, Autres liens, Intitulé,
# Entreprise, Lieu, Contrat, Télétravail, Salaire min (€ annuel), Salaire max (€ annuel),
# Salaire, Publié le, Sources, Source principale, Doublons, Description, URL entreprise,
# Email, Recherche, Zone recherchée, Score complétude, Vu le, Dernière vue, À vérifier
# export:
#   formats: [xlsx, ods, csv]
#   keep_reposts: false  # Use one row per vacancy. Defaults to true.
#   excel_columns: [Postulé, Statut, Lien, Intitulé, Entreprise, Lieu, Contrat, Publié le, À vérifier]
#   repair_fields_enabled_by_default: true
#   repair_fields_by_source:
#     france_travail: true
#     linkedin: false
#   direct_links_enabled_by_source:
#     jobijoba: false  # Use the original listing URL for Lien and Postuler.

# Tracker sync via rclone. Use a configured remote and match the first export format.
# sync:
#   enabled: true
#   target: "mydrive:Job Search/jobs.xlsx"

# Select the bundled environment overlay. JOBSFR_APP_ENV in the environment or .env takes priority.
# app_env: dev
