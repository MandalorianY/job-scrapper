# =============================================================================
# 11. Direct Custom Sources
# =============================================================================

hellowork:
  source: hellowork
  base_url: https://www.hellowork.com

welcome_to_the_jungle:
  source: welcome_to_the_jungle
  site_url: https://www.welcometothejungle.com
  algolia_url: https://<ALGOLIA_HOST>/1/indexes/*/queries?x-algolia-agent=Algolia%20for%20JavaScript%20(4.20.0)%3B%20Browser&search_origin=jobs_search_client
  algolia_app_id: <ALGOLIA_APP_ID>
  job_index: example_jobs_index
  around_lat_lng: 45.7640,4.8357
  around_radius: 25000
  office_country_filter: '["offices.country_code:FR"]'

# =============================================================================
# 12. Aggregators
# =============================================================================

aggregators:
  source: aggregators
  direct_locations:
    - 84R
  direct_specs:
    - source: example_direct_board
      search_url_templates:
        - https://jobs.example.com/search?query={query}&location={department}
      link_prefixes:
        - /offres/recherche/detail/
      base_url: https://jobs.example.com
      max_links: 12
      use_direct_locations: true
    - source: emploi_territorial
      search_url_templates:
        - https://www.emploi-territorial.fr/recherche_emploi_mobilite/?search-col={query}
      link_prefixes:
        - /offre/
      base_url: https://www.emploi-territorial.fr
      max_links: 20
    - source: meteojob
      search_url_templates:
        - https://www.meteojob.com/Auvergne-Rh%C3%B4ne-Alpes-Emploi-{query}
      link_prefixes:
        - /jobs/
      base_url: https://www.meteojob.com
      max_links: 18
      query_style: title_slug
    - source: jobijoba
      search_url_templates:
        - https://www.jobijoba.com/fr/emploi/{query}/Auvergne-Rhone-Alpes
      link_prefixes:
        - /fr/annonce/
      base_url: https://www.jobijoba.com
      max_links: 18
    - source: makesense
      search_url_templates:
        - https://jobs.makesense.org/fr/s/jobs/all/example-role/cdi?sortBy=relevance
        - https://jobs.makesense.org/fr/s/jobs/all/all/cdi?contracts=cdd&sortBy=relevance
      link_prefixes:
        - /fr/jobs/
        - /fr/s/jobs/
      base_url: https://jobs.makesense.org
      max_links: 12
  site_search_sources:
    - source: apec
      query_template: site:apec.fr/candidat/recherche-emploi emploi CDI "{location}" {query} -stage -alternance
      host: apec.fr
    - source: isarta
      query_template: site:isarta.fr/emplois emploi CDI "{location}" {query} -stage -alternance
      host: isarta.fr
    - source: emploi_collectivites
      query_template: site:emploi-collectivites.fr emploi CDI "{location}" {query} -stage -alternance
      host: emploi-collectivites.fr
    - source: cadremploi
      query_template: site:cadremploi.fr emploi CDI "{location}" {query} -stage -alternance
      host: cadremploi.fr
    - source: optioncarriere
      query_template: site:optioncarriere.com emploi CDI "{location}" {query} -stage -alternance
      host: optioncarriere.com
