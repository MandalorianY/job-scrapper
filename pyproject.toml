[project]
name = "scrapper"
version = "0.1.0"
description = "A Python job scraper for job seekers that deduplicates listings across boards and exports a local Excel application tracker."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = [
    "job-scraper",
    "job-search",
    "application-tracker",
    "excel",
    "duckdb",
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=2.0.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.4",
    "pydantic-settings[yaml]>=2.16.3",
    "python-dotenv>=1.2.4",
    "python-jobspy>=1.4.1",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "typer>=0.29.2",
    "xlsxwriter>=3.3.3",
]

[project.scripts]
job-scrapper = "scrapper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "fixture-scope"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=scrapper",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]
markers = [
    "property: hypothesis property-based tests",
    "slow: marks tests as slow",
    "integration: requires external services",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/scrapper"]
omit = [
    "src/scrapper/__init__.py",
    "src/scrapper/cli.py",
    "src/scrapper/scrapers/*.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.pyright]
include = ["src", "tests", "main.py"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.taskipy.tasks]
pre_test = "task lint"
test = "PROFILE=local uv run --locked --group test pytest --cov --cov-config=pyproject.toml --cov-report=term-missing --cov-report=html -vv"
post_test = "echo \"Coverage report generated in htmlcov/index.html\""
lint = "ruff check . && ruff check . --diff"
format = "ruff check . --fix && ruff format ."

[dependency-groups]
dev = ["ruff>=0.17.6", "taskipy>=1.14.1"]
test = [
    "anyio>=4.16.0",
    "hypothesis>=6.170.17",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
]
