[project]
name = "jobsfr"
version = "0.2.0"
description = "Open-source Python scraper for French job boards including France Travail, HelloWork, and Welcome to the Jungle. Exports listings to Excel and CSV."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = [
    "job-scraper",
    "job-search",
    "french-job-boards",
    "france-travail",
    "hellowork",
    "offres-emploi",
    "application-tracker",
    "excel",
    "duckdb",
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=2.0.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pandas==3.1.1",
    "pandera[pandas]>=0.36.0",
    "pydantic>=2.14.4",
    "pydantic-settings[yaml]>=2.16.3",
    "python-dotenv>=1.2.4",
    "python-jobspy>=1.4.1",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "typer>=0.29.2",
    "tzdata>=2026.1",
    "xlsxwriter>=3.3.3",
]

[project.scripts]
jobsfr = "jobsfr.cli:main"

[project.optional-dependencies]
ods = ["odfpy>=1.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["**/.env", "**/*.local.yaml", "**/README.local.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/jobsfr"]

[tool.hatch.build.targets.wheel.force-include]
"datasets/employers/v1/company_types.csv" = "jobsfr/catalogs/company_types.csv"
"docs/config.local.example.yaml" = "jobsfr/config/config.local.example.yaml"

[tool.hatch.build.targets.sdist]
include = [
    "/src/jobsfr",
    "/datasets/employers/v1/company_types.csv",
    "/docs/config.local.example.yaml",
    "/deploy",
    "/tests",
    "/.github/workflows",
    "/.dockerignore",
    "/.env.example",
    "/.gitignore",
    "/.python-version",
    "/AGENTS.md",
    "/Dockerfile",
    "/main.py",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "fixture-scope"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=jobsfr",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]
markers = [
    "property: hypothesis property-based tests",
    "slow: marks tests as slow",
    "integration: requires external services",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/jobsfr"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.pyright]
include = ["src", "tests", "main.py"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.poe.executor]
type = "uv"
locked = true

[tool.poe.tasks]
lint = ["_ruff", "_format_check"]
_ruff = "ruff check ."
_format_check = "ruff format --check ."
typecheck = ["_pyright_windows", "_pyright_linux", "_pyright_macos"]
_pyright_windows = "pyright --warnings --pythonplatform Windows ."
_pyright_linux = "pyright --warnings --pythonplatform Linux ."
_pyright_macos = "pyright --warnings --pythonplatform Darwin ."
test = ["lint", "_pytest"]
_pytest = { cmd = "pytest -vv", env = { PROFILE = "local" }, executor = { group = "test" } }
format = [{ cmd = "ruff check . --fix" }, { cmd = "ruff format ." }]

[tool.poe.tasks.check]
sequence = ["lint", "typecheck", "_pytest"]
env = { JOBSFR_DISABLE_LOCAL_CONFIG = "1", JOBSFR_RUN_REAL_SMOKE = "0", PYTHONUTF8 = "1", UV_NO_SYNC = "1" }

[dependency-groups]
dev = [{ include-group = "lint" }, "poethepoet>=0.49.0", "pyright>=1.1.414"]
lint = ["ruff>=0.17.6"]
release = ["pyinstaller>=6.22.3"]
test = [
    { include-group = "lint" },
    "anyio>=4.16.0",
    "hypothesis>=6.170.17",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
]
