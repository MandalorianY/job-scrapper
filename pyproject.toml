[project]
name = "scrapper"
version = "0.1.0"
description = "A Python job-search scraper for configured example roles in Example Region, Example Country."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "crawlee>=1.7.1",
    "duckdb>=1.5.3",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.4",
    "pydantic-settings[yaml]>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-jobspy>=1.1.82",
    "rich>=15.0.0",
    "typer>=0.26.5",
    "xlsxwriter>=3.2.0",
]

[project.scripts]
job-scrapper = "scrapper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=scrapper",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]
markers = [
    "property: hypothesis property-based tests",
    "slow: marks tests as slow",
    "integration: requires external services",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
branch = true
source = ["src/scrapper"]
omit = [
    "src/scrapper/__init__.py",
    "src/scrapper/cli.py",
    "src/scrapper/scrapers/*.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.taskipy.tasks]
pre_test = "task lint"
test = "PROFILE=local pytest --cov --cov-config=pyproject.toml --cov-report=term-missing --cov-report=html -vv"
post_test = "echo \"Coverage report generated in htmlcov/index.html\""
lint = "ruff check . && ruff check . --diff"
format = "ruff check . --fix && ruff format ."

[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "taskipy>=1.14.1",
]
test = [
    "anyio>=4.13.0",
    "hypothesis>=6.155.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
